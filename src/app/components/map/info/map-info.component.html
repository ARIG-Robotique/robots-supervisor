<div class="card">
    <h5 class="card-header">
        <fa-icon icon="info-circle"></fa-icon>
        Informations
    </h5>
    <div class="card-body">
        <div class="row">
            <div class="col-3">
                Equipe :
                <span
                    class="badge badge-big"
                    [style.background]="team === 'BLEU' ? '#4E84A2' : team === 'JAUNE' ? '#DA9A14' : '#555'"
                    >{{ team }}</span
                >
            </div>
            <div class="col-3">
                Temps :
                <span class="badge badge-big bg-info">{{ mainPosition?.matchTime / 1000 | number: '3.0-0' }}s</span>
            </div>
        </div>
        <div class="row">
            <span class="col">Panneaux</span>
        </div>
        <div class="row">
            <div class="col" *ngFor="let panneau of mainPosition?.gameStatus?.panneaux; trackBy: trackByIndex">
                <div
                    class="panneau"
                    [class.panneau--BLEU]="panneauIsBleu(panneau)"
                    [class.panneau--JAUNE]="panneauIsJaune(panneau)"
                ></div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <strong>Jardinières</strong>
                <ng-container
                    *ngTemplateOutlet="
                        plantes;
                        context: { title: 'N', plantes: mainPosition?.gameStatus?.jardinieres?.NORD }
                    "
                ></ng-container>
                <ng-container
                    *ngTemplateOutlet="
                        plantes;
                        context: { title: 'M', plantes: mainPosition?.gameStatus?.jardinieres?.MILIEU }
                    "
                ></ng-container>
                <ng-container
                    *ngTemplateOutlet="
                        plantes;
                        context: { title: 'S', plantes: mainPosition?.gameStatus?.jardinieres?.SUD }
                    "
                ></ng-container>
            </div>
            <div class="col">
                <strong>Aires de dépose</strong>
                <ng-container
                    *ngTemplateOutlet="
                        plantes;
                        context: { title: 'N', plantes: mainPosition?.gameStatus?.airesDepose?.NORD }
                    "
                ></ng-container>
                <ng-container
                    *ngTemplateOutlet="
                        plantes;
                        context: { title: 'M', plantes: mainPosition?.gameStatus?.airesDepose?.MILIEU }
                    "
                ></ng-container>
                <ng-container
                    *ngTemplateOutlet="
                        plantes;
                        context: { title: 'S', plantes: mainPosition?.gameStatus?.airesDepose?.SUD }
                    "
                ></ng-container>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <ng-container
                    *ngTemplateOutlet="
                        plantes;
                        context: { title: 'Bras Avt.', plantes: mainPosition?.gameStatus?.brasAvant }
                    "
                ></ng-container>
            </div>
            <div class="col">
                <ng-container
                    *ngTemplateOutlet="
                        plantes;
                        context: { title: 'Bras Arr.', plantes: mainPosition?.gameStatus?.brasArriere }
                    "
                ></ng-container>
            </div>
        </div>
        <div class="row">
            <span class="col">Etats</span>
        </div>
        <div style="columns: 2">
            <div
                *ngFor="let item of mainPosition?.gameFlags | keyvalue; trackBy: trackByIndex"
                class="badge badge-big d-block mb-1"
                [ngClass]="{ 'bg-success': item.value, 'bg-danger': !item.value }"
            >
                {{ item.key }}
            </div>
        </div>
    </div>
</div>

<ng-template #plantes let-title="title" let-plantes="plantes">
    <div class="d-flex">
        <div class="flex-grow-0 mr-1">{{ title }}</div>
        <ng-container *ngFor="let plante of plantes; trackBy: trackByIndex">
            <div *ngIf="plante" [class]="'plante plante--' + plante.type" [class.plante--pot]="plante.dansPot"></div>
        </ng-container>
    </div>
</ng-template>
