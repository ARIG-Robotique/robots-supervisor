<div class="card">
    <h5 class="card-header">
        <fa-icon icon="info-circle"></fa-icon>
        Informations
    </h5>
    <div class="card-body">
        <div class="row">
            <div class="col">
                Equipe :
                <span
                    class="badge badge-big"
                    [style.background]="team === 'BLEU' ? '#4E84A2' : team === 'JAUNE' ? '#DA9A14' : '#555'"
                >{{ team }}</span
                >
            </div>
            <div class="col">
                Temps :
                <span class="badge badge-big bg-info">{{ mainPosition?.matchTime / 1000 | number: '3.0-0' }}s</span>
            </div>
        </div>
        <div class="row">
            <div class="col">
                Stratégie :
                <span class="badge badge-big bg-info">{{ mainPosition?.strategy }}</span>
            </div>
        </div>
        <div class="row">
            <span class="col">Options match :</span>
        </div>
        <div style="columns: 2">
            <div
                *ngFor="let item of mainPosition?.gameConfigs | keyvalue; trackBy: trackByIndex"
                class="badge badge-big d-block mb-1"
                [ngClass]="{ 'bg-success': item.value, 'bg-danger': !item.value }"
            >
                {{ item.key }}
            </div>
        </div>
        <div class="row">
            <strong class="col">Stock Avt. :</strong>
            <strong class="col">Stock Arr. :</strong>
        </div>
        <div class="row">
            <div class="col">
                <ng-container
                    *ngTemplateOutlet="
                        stock;
                        context: { stockFace: mainPosition?.gameStatus?.faceAvant }
                    "
                ></ng-container>
            </div>
            <div class="col">
                <ng-container
                    *ngTemplateOutlet="
                        stock;
                        context: { stockFace: mainPosition?.gameStatus?.faceArriere }
                    "
                ></ng-container>
            </div>
        </div>
        <div class="row">
            <span class="col">Etats :</span>
        </div>
        <div style="columns: 2">
            <div
                *ngFor="let item of mainPosition?.gameFlags | keyvalue; trackBy: trackByIndex"
                class="badge badge-big d-block mb-1"
                [ngClass]="{ 'bg-success': item.value, 'bg-danger': !item.value }"
            >
                {{ item.key }}
            </div>
        </div>
    </div>
</div>

<ng-template #stock let-stockFace="stockFace">
    <div class="d-flex flex-column" *ngIf="stockFace">
        <div>
            <div
                class="planche"
                [class.planche--PRESENTE]="stockFace.tiroirHaut"
                style="margin-bottom: 0"
            ></div>
        </div>
        <div>
            <div
                class="planche"
                [class.planche--PRESENTE]="stockFace.tiroirBas"
            ></div>
        </div>
        <div class="d-flex flex-row">
            <div
                class="conserve"
                [class.conserve--PRESENTE]="stockFace.pinceGauche"
            ></div>
            <div
                class="conserve"
                [class.conserve--PRESENTE]="stockFace.pinceDroite"
            ></div>
        </div>
        <div class="d-flex flex-row">
            <div
                class="conserve"
                [class.conserve--PRESENTE]="stockFace.solGauche"
            ></div>
            <div
                class="conserve"
                [class.conserve--PRESENTE]="stockFace.solDroite"
            ></div>
        </div>
    </div>
</ng-template>
